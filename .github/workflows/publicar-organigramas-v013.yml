              patch = base64.b64decode("".join(payload.split()), validate=True)
              if hashlib.sha256(patch).hexdigest() != PATCH_HASH:
                  raise SystemExit("Error de integridad del delta; no se modifica index.html.")
              outer = source.decode("utf-8")
              match = re.search(r"const DOCS=(\[.*?\]);\nlet current=", outer, re.S)
              if match is None:
                  raise SystemExit("No se encontro la estructura de la presentacion.")
              docs = [base64.b64decode(x).decode("utf-8") for x in json.loads(match[1])]
              if len(docs) != 3:
                  raise SystemExit("Se esperaban tres organigramas.")
              template = outer[:match.start(1)] + "__EMBEDDED_DOCS__" + outer[match.end(1):]
              parts = json.dumps(docs + [template], ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              if hashlib.sha256(parts).hexdigest() != "2a5357d58945180053aef0279fbca6a633c5bfa353936d3cd8592bc2dff49edc":
                  raise SystemExit("La estructura base no coincide; no se modifica el sitio.")
              with tempfile.TemporaryDirectory() as directory:
                  temp = Path(directory)
                  (temp / "base.json").write_bytes(parts)
                  (temp / "update.zst").write_bytes(patch)
                  subprocess.run(["zstd", "--quiet", "--decompress", "--patch-from=" + str(temp / "base.json"), str(temp / "update.zst"), "-o", str(temp / "next.json")], check=True)
                  restored = (temp / "next.json").read_bytes()
              if hashlib.sha256(restored).hexdigest() != "c2cdae6631c547d5c86c4e012b2da347c3de8bcb74820a8a289fd2ec197fe2d6":
                  raise SystemExit("Las vistas recuperadas no coinciden con la version aprobada.")
              values = json.loads(restored)
              if len(values) != 4 or values[3].count("__EMBEDDED_DOCS__") != 1:
                  raise SystemExit("Estructura de salida invalida.")
              encoded = [base64.b64encode(x.encode("utf-8")).decode("ascii") for x in values[:3]]
              output = values[3].replace("__EMBEDDED_DOCS__", json.dumps(encoded, separators=(",", ":")), 1).encode("utf-8")
              if len(output) != 1499095 or hashlib.sha256(output).hexdigest() != TARGET:
                  raise SystemExit("La salida no coincide con el HTML 0.13 aprobado; no se escribe.")
              if b'name="ier-presentation-version" content="0.13"' not in output:
                  raise SystemExit("Identificador de version incorrecto.")
              Path(".index.v013.tmp").write_bytes(output)
              Path(".index.v013.tmp").replace(path)
              print("HTML 0.13 verificado: 1499095 bytes; SHA-256 " + TARGET)
          Path("SHA256SUMS").write_text(TARGET + "  index.html\n", encoding="utf-8")
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("versión 0.11", "versión 0.13").replace("1,426,117 bytes", "1,499,095 bytes").replace(SOURCE, TARGET)
          addition = "- IA transversal: laboratorios autónomos en RedLab, diseño asistido con IA en USTE, investigación asistida y PT8, y Observatorio IER (PT10) en administración.\n- Leyendas de IA redistribuidas, con espacios y trayectorias diferenciados en las tres vistas.\n\n"
          if "Leyendas de IA redistribuidas" not in text:
              text = text.replace("### Integridad del archivo publicado", addition + "### Integridad del archivo publicado")
          readme.write_text(text, encoding="utf-8")
          PYCODE
      - name: Guardar presentacion y metadatos
        shell: bash
        run: |
          set -euo pipefail
          git add index.html SHA256SUMS README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar organigramas IER a v0.13 (archivo aprobado verificado)'
            git push origin HEAD:main
          fi
