name: Actualizar organigramas IER a v0.11

on:
  push:
    branches: [main]
    paths: ['.github/workflows/actualizar-v11.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y verificar la versión 0.11
        env:
          SOURCE_URL: 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-fc2c-820d-b610-d86e8275bf17/raw?se=2026-10-18T05%3A31%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=c5d9a4f4-f047-510f-af65-f510ad396fa6&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T14%3A12%3A54Z&ske=2026-10-18T14%3A12%3A54Z&sks=b&skv=2026-02-06&sig=YFI6YULu3OyXNlIn1ysmvpqAoV2Dnwjk6RGtFgBUd10%3D'
          EXPECTED_SHA256: '2ce23c2ca6ba44cad167225c0623c3e996fd485d7f44a61823e99953345eba7f'
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_URL"
          curl --fail --location --retry 2 --max-time 90 --silent --show-error "$SOURCE_URL" -o index.html
          echo "$EXPECTED_SHA256  index.html" | sha256sum --check --strict
          test "$(wc -c < index.html)" -eq 1426117
          grep -q 'name="ier-presentation-version" content="0.11"' index.html
          printf '%s\n' "$EXPECTED_SHA256  index.html" > SHA256SUMS
      - name: Guardar versión 0.11
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar organigramas interactivos IER a v0.11'
            git push origin HEAD:main
          fi
