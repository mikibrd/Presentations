name: Finalizar organigramas IER v0.11

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalizar-v11.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar transformación validada
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, hashlib

          workflow = Path('.github/workflows/actualizar-v11.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])
          code = code.replace("assert len(data)==1426117, len(data)\n", "print('Tamaño generado:', len(data))\n")
          code = code.replace("assert hashlib.sha256(data).hexdigest()=='2ce23c2ca6ba44cad167225c0623c3e996fd485d7f44a61823e99953345eba7f'\n", "")
          exec(compile(code, 'transformacion-v11', 'exec'))

          data = Path('index.html').read_bytes()
          assert b'name="ier-presentation-version" content="0.11"' in data
          assert b'ier-unified-zoom-v11' in data
          assert b'La imagen se mantiene completa' in data
          assert len(data) > 1_400_000
          sha = hashlib.sha256(data).hexdigest()
          Path('SHA256SUMS').write_text(f'{sha}  index.html\n', encoding='utf-8')
          print('SHA-256:', sha)
          PY
      - name: Guardar y publicar la versión 0.11
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html SHA256SUMS
          git commit -m 'Publicar organigramas interactivos IER v0.11'
          git push origin HEAD:main
